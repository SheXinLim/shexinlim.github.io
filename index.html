<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isometric Sushi Concept</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #b5d3e7; /* Soft pastel blue background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Top-left brand logo */
        .logo {
            position: absolute;
            top: 30px;
            left: 40px;
            color: #ffffff;
            font-weight: 800;
            font-size: 24px;
            letter-spacing: 1px;
        }

        /* Scene container with isometric perspective */
        .scene {
            position: relative;
            width: 700px;
            height: 500px;
            transform: perspective(1000px) rotateX(55deg) rotateZ(-40deg);
            transform-style: preserve-3d;
        }

        /* Main UI Interface Window */
        .browser-window {
            position: absolute;
            width: 520px;
            height: 340px;
            background: rgba(235, 243, 249, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 6px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 30px 1fr 1fr;
            gap: 15px;
        }

        /* Browser Header Dots */
        .browser-header {
            grid-column: span 3;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            padding-bottom: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
        }

        .lines {
            width: 14px;
            height: 2px;
            background: rgba(255, 255, 255, 0.8);
            margin-left: 6px;
            box-shadow: 0 4px 0 rgba(255, 255, 255, 0.8);
        }

        /* Content Cards inside the UI */
        .card {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 10px;
        }

        .card-lines {
            width: 60%;
            height: 4px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 2px;
            margin-top: 12px;
            position: relative;
        }

        .card-lines::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 40%;
            height: 3px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 2px;
        }

        /* Isometric Ship */
        .ship {
            position: absolute;
            top: 20px;
            left: 120px;
            width: 120px;
            height: 180px;
            transform: translateZ(60px);
            transform-style: preserve-3d;
        }

        .hull {
            position: absolute;
            bottom: 0;
            width: 110px;
            height: 70px;
            background: #e8726d; /* Coral red */
            border-radius: 0 0 20px 10px;
            transform: skewX(-20deg);
            box-shadow: -10px 10px 20px rgba(0,0,0,0.1);
        }

        .deck {
            position: absolute;
            bottom: 45px;
            left: 10px;
            width: 90px;
            height: 50px;
            background: #f4f6f8;
            transform: skewX(-20deg);
            background-image: repeating-linear-gradient(0deg, #e1e7ec, #e1e7ec 2px, transparent 2px, transparent 6px);
        }

        .cabin {
            position: absolute;
            bottom: 75px;
            left: 20px;
            width: 60px;
            height: 70px;
            background: #ffffff;
            border-radius: 2px;
        }

        .flagpole {
            position: absolute;
            top: -15px;
            left: 30px;
            width: 2px;
            height: 25px;
            background: #ffffff;
        }

        .flag {
            position: absolute;
            top: -15px;
            left: 32px;
            width: 12px;
            height: 8px;
            background: #e8726d;
        }

        /* Minimalist Food Graphics (CSS shapes) */
        /* Bowl */
        .bowl {
            width: 30px;
            height: 18px;
            background: #2b303a;
            border-radius: 0 0 15px 15px;
            position: relative;
        }
        .bowl::after {
            content: '';
            position: absolute;
            top: -3px;
            left: 2px;
            width: 26px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
        }

        /* Nigiri / Sushi pieces */
        .nigiri-pink {
            width: 36px;
            height: 18px;
            background: #f29c99;
            border-radius: 4px;
            box-shadow: 0 3px 0 #d97875;
            position: relative;
        }
        .nigiri-pink::after {
            content: '';
            position: absolute;
            top: 0; left: 6px; right: 6px; height: 100%;
            background: repeating-linear-gradient(90deg, transparent, transparent 4px, #e8726d 4px, #e8726d 6px);
            border-radius: 2px;
        }

        .maki-roll {
            width: 32px;
            height: 24px;
            background: #2b303a;
            border-radius: 4px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 0 #14171c;
        }
        .maki-roll::before {
            content: '';
            width: 18px;
            height: 12px;
            background: #f4f6f8;
            border-radius: 2px;
        }

        .nigiri-yellow {
            width: 36px;
            height: 18px;
            background: #f7e47b;
            border-radius: 4px;
            box-shadow: 0 3px 0 #d9c455;
            position: relative;
        }
        .nigiri-yellow::before {
            content: '';
            position: absolute;
            top: 0; left: 12px; width: 10px; height: 100%;
            background: #2b303a;
        }

        /* Floating background plants/decorations */
        .plant {
            position: absolute;
            width: 8px;
            height: 20px;
            background: #e8726d;
            clip-path: polygon(50% 0%, 100% 30%, 70% 30%, 100% 70%, 50% 100%, 0% 70%, 30% 30%, 0% 30%);
        }

        .p1 { top: 60px; left: -40px; transform: translateZ(10px); }
        .p2 { bottom: 40px; left: 100px; transform: translateZ(10px); }
        .p3 { bottom: 10px; left: 160px; transform: translateZ(10px); }
        .p4 { bottom: 80px; right: -30px; transform: translateZ(10px); }
        .p5 { top: 80px; right: -20px; transform: translateZ(10px); }
    </style>
</head>
<body>

    <div class="logo">wrk.</div>

    <div class="scene">
        <!-- Browser / UI Layout Wireframe -->
        <div class="browser-window">
            <div class="browser-header">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="lines"></div>
            </div>
            
            <!-- Card 1: Rice Bowl -->
            <div class="card" style="grid-column: 1; grid-row: 2;">
                <div class="bowl"></div>
                <div class="card-lines"></div>
            </div>

            <!-- Card 2: Pink Nigiri -->
            <div class="card" style="grid-column: 1; grid-row: 3;">
                <div class="nigiri-pink"></div>
                <div class="card-lines"></div>
            </div>

            <!-- Card 3: Maki Rolls -->
            <div class="card" style="grid-column: 2; grid-row: 3;">
                <div style="display: flex; gap: 4px;">
                    <div class="maki-roll"></div>
                    <div class="maki-roll"></div>
                </div>
                <div class="card-lines"></div>
            </div>

            <!-- Card 4: Yellow/Tamago Nigiri -->
            <div class="card" style="grid-column: 3; grid-row: 2;">
                <div class="nigiri-yellow"></div>
                <div class="card-lines"></div>
            </div>
        </div>

        <!-- Isometric Ship Model -->
        <div class="ship">
            <div class="flagpole"></div>
            <div class="flag"></div>
            <div class="cabin"></div>
            <div class="deck"></div>
            <div class="hull"></div>
        </div>

        <!-- Decorative background elements -->
        <div class="plant p1"></div>
        <div class="plant p2"></div>
        <div class="plant p3"></div>
        <div class="plant p4"></div>
        <div class="plant p5"></div>
    </div>

</body>
</html>
